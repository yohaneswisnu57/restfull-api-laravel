openapi: 3.0.3

info:
  title: RESTful API — Laravel + Sanctum
  description: |
    A token-based authentication API built with **Laravel 13** and **Laravel Sanctum**.

    ## How to Use
    1. Use **Register** or **Login** to get an `access_token`
    2. Click the **Authorize 🔓** button at the top right
    3. Enter your token as: `Bearer {your_access_token}`
    4. Now you can try all protected endpoints directly from this page

    ## Token Expiration
    Tokens are valid for **24 hours** by default. After that, you need to login again.
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8000/api
    description: Local Development Server

tags:
  - name: Authentication
    description: Register, Login, Logout, and Profile endpoints

paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: |
        Create a new user account. Returns an `access_token` immediately after successful registration.
        No authentication required.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: John Doe
              email: john@example.com
              password: password123
              password_confirmation: password123
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                message: User registered successfully.
                user:
                  id: 1
                  name: John Doe
                  email: john@example.com
                  email_verified_at: null
                  created_at: '2026-05-28T07:28:00.000000Z'
                  updated_at: '2026-05-28T07:28:00.000000Z'
                access_token: 1|AbCdEfGhIjKlMnOpQrStUvWxYz1234567890
                token_type: Bearer
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                email_taken:
                  summary: Email already registered
                  value:
                    message: The email has already been taken.
                    errors:
                      email:
                        - The email has already been taken.
                password_mismatch:
                  summary: Password confirmation mismatch
                  value:
                    message: The password field confirmation does not match.
                    errors:
                      password:
                        - The password field confirmation does not match.

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login and get an access token
      description: |
        Authenticate with email and password to receive a Bearer token.
        Save the `access_token` from the response and use it to access protected endpoints.
        No authentication required.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: john@example.com
              password: password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                message: Login successful.
                user:
                  id: 1
                  name: John Doe
                  email: john@example.com
                  email_verified_at: null
                  created_at: '2026-05-28T07:28:00.000000Z'
                  updated_at: '2026-05-28T07:28:00.000000Z'
                access_token: 2|AbCdEfGhIjKlMnOpQrStUvWxYz1234567890
                token_type: Bearer
                expires_at: '2026-05-29 07:28:00'
        '422':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: The provided credentials are incorrect.
                errors:
                  email:
                    - The provided credentials are incorrect.

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user profile
      description: |
        Returns the profile of the currently authenticated user.
        Requires a valid Bearer token in the Authorization header.
      operationId: me
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
              example:
                user:
                  id: 1
                  name: John Doe
                  email: john@example.com
                  email_verified_at: null
                  created_at: '2026-05-28T07:28:00.000000Z'
                  updated_at: '2026-05-28T07:28:00.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout from this device
      description: |
        Revokes the current access token. Only affects the current session.
        Other active tokens on other devices will remain valid.
        Requires a valid Bearer token.
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Logged out successfully.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/logout-all:
    post:
      tags:
        - Authentication
      summary: Logout from all devices
      description: |
        Revokes **all** active tokens for the current user.
        This will log out the user from every device and session simultaneously.
        Requires a valid Bearer token.
      operationId: logoutAll
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out from all devices successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Logged out from all devices successfully.
        '401':
          $ref: '#/components/responses/Unauthenticated'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Enter your token in the format: `Bearer {token}`

        Get a token by calling the **Login** or **Register** endpoint first.

  schemas:
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
        - password_confirmation
      properties:
        name:
          type: string
          maxLength: 255
          example: John Doe
          description: Full name of the user
        email:
          type: string
          format: email
          maxLength: 255
          example: john@example.com
          description: Must be a unique, valid email address
        password:
          type: string
          minLength: 8
          example: password123
          description: Minimum 8 characters
        password_confirmation:
          type: string
          example: password123
          description: Must match the password field

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          example: password123

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        email_verified_at:
          type: string
          format: date-time
          nullable: true
          example: null
        created_at:
          type: string
          format: date-time
          example: '2026-05-28T07:28:00.000000Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-05-28T07:28:00.000000Z'

    AuthResponse:
      type: object
      properties:
        message:
          type: string
          example: User registered successfully.
        user:
          $ref: '#/components/schemas/User'
        access_token:
          type: string
          example: 1|AbCdEfGhIjKlMnOpQrStUvWxYz1234567890
          description: Use this token in the Authorization header for protected endpoints
        token_type:
          type: string
          example: Bearer

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/AuthResponse'
        - type: object
          properties:
            expires_at:
              type: string
              example: '2026-05-29 07:28:00'
              description: When the token will expire (null means never)

    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: Operation successful.

    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: The given data was invalid.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email:
              - The email has already been taken.

    UnauthenticatedError:
      type: object
      properties:
        message:
          type: string
          example: Unauthenticated.

  responses:
    Unauthenticated:
      description: Token is missing, expired, or revoked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthenticatedError'
          example:
            message: Unauthenticated.
